<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Salle de musculation</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&amp;family=Zen+Kaku+Gothic+New:wght@700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 844px; height: 390px; box-sizing: border-box; padding: 8px; background: {{paper}}; font-family: 'Zen Kaku Gothic New', sans-serif; color: {{ink}}; display: flex; flex-direction: column; gap: 8px">

<div style="height: 50px; flex-shrink: 0; box-sizing: border-box; background: {{ink}}; color: {{panel}}; padding: 0 6px 0 2px; display: flex; align-items: center; gap: 12px">
<button aria-label="Retour" style="width: 44px; height: 44px; border: 0; background: transparent; display: flex; align-items: center; justify-content: center; cursor: pointer; padding: 0">
<svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="{{panel}}" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"></path></svg>
</button>
<div style="font-family: 'Dela Gothic One', sans-serif; font-size: 24px; color: {{accent}}; transform: skewX(-8deg)">LA SALLE</div>
<div style="flex: 1"></div>
<div style="display: flex; align-items: center; gap: 2px">
<div style="font-family: 'Dela Gothic One', sans-serif; font-size: 13px; margin-right: 6px">ÉNERGIE</div>
<sc-for list="{{pips}}" as="pip" hint-placeholder-count="3">
<svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="{{pip.fill}}" stroke="{{panel}}" stroke-width="2" stroke-linejoin="round"><path d="M13 2L4 14h7l-1 8 9-12h-7z"></path></svg>
</sc-for>
<div style="font-family: 'Dela Gothic One', sans-serif; font-size: 13px; margin-left: 4px">{{energyLeft}}/{{energyMax}}</div>
</div>
<div style="display: flex; align-items: center; gap: 6px; padding: 2px 10px; border: 2px solid {{panel}}; font-family: 'Dela Gothic One', sans-serif; font-size: 14px">240 PRIMES</div>
<a href="Pesee.dc.html" style="height: 40px; padding: 0 14px; background: {{accent}}; border: 3px solid {{panel}}; box-sizing: border-box; color: {{onAccent}}; text-decoration: none; display: flex; align-items: center; font-family: 'Dela Gothic One', sans-serif; font-size: 15px">PESÉE</a>
</div>

<div style="flex: 1; display: flex; gap: 8px; min-height: 0">

<div style="width: 252px; border: 3px solid {{ink}}; background: {{panel}}; box-sizing: border-box; padding: 8px; display: flex; flex-direction: column; gap: 8px">
<div style="display: flex; gap: 10px">
<div style="width: 104px; height: 146px; flex-shrink: 0; border: 3px solid {{ink}}; background: {{focusBg}}; display: flex; align-items: flex-end; justify-content: center; overflow: hidden; position: relative">
<dc-import name="Poulet" pose="face" palier="2" size="130" hint-size="104px,130px"></dc-import>
<div style="position: absolute; left: 0; top: 0; padding: 0 6px; background: {{lime}}; color: #111111; border-right: 2px solid {{ink}}; border-bottom: 2px solid {{ink}}; font-family: 'Dela Gothic One', sans-serif; font-size: 11px">PALIER 2/5</div>
</div>
<div style="flex: 1; display: flex; flex-direction: column; gap: 5px; justify-content: center">
<sc-for list="{{stats}}" as="s" hint-placeholder-count="5">
<div style="display: flex; flex-direction: column; gap: 1px">
<div style="display: flex; justify-content: space-between; font-size: 12px"><span>{{s.name}}</span><span style="font-family: 'Dela Gothic One', sans-serif">{{s.value}}</span></div>
<div style="height: 8px; background: {{panel}}; border: 2px solid {{ink}}; overflow: hidden"><div style="width: {{s.pct}}; height: 100%; background: {{s.color}}"></div></div>
</div>
</sc-for>
</div>
</div>
<div style="flex: 1"></div>
<div style="border: 4px double {{ink}}; padding: 4px 8px">
<div style="font-family: 'Dela Gothic One', sans-serif; font-size: 13px">50,2 KG · MOUCHE 49,0–50,8 KG</div>
<div style="font-size: 12px">Pesée OK si tu t'arrêtes là</div>
</div>
</div>

<div style="flex: 1; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; padding: 0 8px">
<sc-for list="{{games}}" as="g" hint-placeholder-count="3">
<div style="border: 3px solid {{ink}}; background: {{panel}}; transform: skewX(-4deg); overflow: hidden; display: flex; flex-direction: column">
<div style="height: 86px; position: relative; border-bottom: 3px solid {{ink}}; background-color: {{panel}}; background-image: {{g.bg}}; background-size: {{g.bgSize}}; overflow: hidden">
<svg aria-hidden="true" width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="{{ink}}" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" style="position: absolute; left: 10px; top: 20px; background: {{panel}}; border: 2.5px solid {{ink}}; padding: 3px"><path d="{{g.icon}}"></path></svg>
<div aria-hidden="true" style="position: absolute; right: 10px; top: 8px; transform: rotate(-8deg); font-family: 'Dela Gothic One', sans-serif; font-size: 34px; line-height: 1; color: {{g.sfxColor}}; text-shadow: {{outline}}">{{g.sfx}}</div>
<div aria-hidden="true" style="position: absolute; right: 12px; top: 50px; font-size: 11px; background: {{panel}}; border: 1.5px solid {{ink}}; padding: 0 4px">{{g.gloss}}</div>
<div style="position: absolute; right: 0; bottom: 0; padding: 0 8px; background: {{ink}}; color: {{panel}}; font-family: 'Dela Gothic One', sans-serif; font-size: 12px">{{g.stat}}</div>
</div>
<div style="padding: 6px 12px 8px; display: flex; flex-direction: column; gap: 2px; flex: 1; transform: skewX(4deg)">
<div style="font-family: 'Dela Gothic One', sans-serif; font-size: 16px; line-height: 1.2">{{g.title}}</div>
<div style="font-size: 13px">{{g.kind}}</div>
<div style="font-size: 13px">{{g.cost}}</div>
<div style="flex: 1"></div>
<button style="height: 44px; border: 3px solid {{ink}}; background: {{ink}}; color: {{panel}}; box-shadow: 3px 3px 0 {{accent}}; font-family: 'Dela Gothic One', sans-serif; font-size: 17px; cursor: pointer">JOUER</button>
<button style="height: 36px; border: 0; background: transparent; color: {{ink}}; font-family: inherit; font-size: 13px; text-decoration: underline; cursor: pointer">Simulation rapide (70 %)</button>
</div>
</div>
</sc-for>
</div>

</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["clair","sombre"],"default":"clair"},"energyLeft":{"editor":"int","min":0,"max":5,"default":2},"energyMax":{"editor":"int","min":3,"max":5,"default":3},"$preview":{"width":844,"height":390}}'>
class Component extends DCLogic {
  renderVals() {
    const dark = this.props.theme === 'sombre';
    const T = dark
      ? { paper: '#0B0B0D', panel: '#17171A', ink: '#F2F2F2', tone: 'rgba(242,242,242,0.18)', accent: '#FF3D96', onAccent: '#0B0B0D', gauge: '#8A8F98', cyan: '#00E5FF', lime: '#C6FF00' }
      : { paper: '#F4F1EA', panel: '#FFFFFF', ink: '#111111', tone: 'rgba(17,17,17,0.22)', accent: '#FF2E88', onAccent: '#111111', gauge: '#9AA0A6', cyan: '#00C2EB', lime: '#B8F000' };
    const o = (c, w) => `-${w}px -${w}px 0 ${c}, ${w}px -${w}px 0 ${c}, -${w}px ${w}px 0 ${c}, ${w}px ${w}px 0 ${c}`;
    const max = this.props.energyMax ?? 3;
    const left = Math.min(this.props.energyLeft ?? 2, max);
    const pips = Array.from({ length: max }, (_, i) => ({ fill: i >= left ? 'none' : T.lime }));
    const tone = `radial-gradient(${dark ? 'rgba(198,255,0,0.45)' : 'rgba(140,190,0,0.55)'} 1.6px, transparent 1.8px)`;
    const speed = `repeating-conic-gradient(from 0deg at 30% 50%, ${T.ink} 0deg 0.8deg, ${T.cyan} 0.8deg 7deg)`;
    const redTone = `radial-gradient(${dark ? 'rgba(255,61,150,0.5)' : 'rgba(255,46,136,0.45)'} 1.6px, transparent 1.8px)`;
    return {
      ...T,
      outline: o(T.ink, 2) + `, 3px 3px 0 ${T.ink}`,
      focusBg: `repeating-conic-gradient(from 0deg at 50% 45%, ${T.ink} 0deg 0.8deg, ${T.panel} 0.8deg 7deg)`,
      energyLeft: left,
      energyMax: max,
      pips,
      stats: [
        { name: 'Force', value: 14, pct: '56%', color: T.accent },
        { name: 'Vitesse', value: 18, pct: '72%', color: T.cyan },
        { name: 'Endurance', value: 11, pct: '44%', color: T.lime },
        { name: 'Résistance', value: 9, pct: '36%', color: T.accent },
        { name: 'Technique', value: 7, pct: '28%', color: T.cyan }
      ],
      games: [
        { sfx: 'グッ', sfxColor: T.accent, gloss: 'HAN !', stat: '+ FORCE', title: 'DÉVELOPPÉ COUCHÉ', kind: 'Rythme · 45 s', cost: 'Gratuit (1re séance)', bg: redTone, bgSize: '7px 7px', icon: 'M6 12h12M3 9v6M6 7v10M18 7v10M21 9v6' },
        { sfx: 'バシッ', sfxColor: T.lime, gloss: 'PAF !', stat: '+ VITESSE', title: 'SAC DE FRAPPE', kind: 'Séquences de gestes · 50 s', cost: '30 primes', bg: speed, bgSize: 'auto', icon: 'M12 2v3M8 5h8v11a4 4 0 0 1-8 0z' },
        { sfx: 'タッ', sfxColor: T.cyan, gloss: 'HOP !', stat: '+ ENDURANCE', title: 'CORDE À SAUTER', kind: 'Timing · 40 s', cost: '30 primes', bg: tone, bgSize: '7px 7px', icon: 'M5 3v6M19 3v6M5 9c0 11 14 11 14 0' }
      ]
    };
  }
}
</script>
</body>
</html>
