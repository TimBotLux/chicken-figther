<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Combat</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&amp;family=Zen+Kaku+Gothic+New:wght@700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 844px; height: 390px; position: relative; overflow: hidden; background: {{focusBg}}; font-family: 'Zen Kaku Gothic New', sans-serif; color: {{ink}}">

<div aria-hidden="true" style="position: absolute; left: 0; top: 122px; width: 844px; height: 50px; background-color: {{panel}}; background-image: {{crowdBg}}; background-size: 26px 30px, 6px 6px; border-top: 3px solid {{ink}}"></div>
<div aria-hidden="true" style="position: absolute; left: -10px; top: 170px; width: 864px; height: 8px; background: {{cyan}}; border: 3px solid {{ink}}"></div>
<div aria-hidden="true" style="position: absolute; left: -10px; top: 192px; width: 864px; height: 8px; background: {{panel}}; border: 3px solid {{ink}}"></div>
<div aria-hidden="true" style="position: absolute; left: -10px; top: 214px; width: 864px; height: 8px; background: {{accent}}; border: 3px solid {{ink}}"></div>
<div aria-hidden="true" style="position: absolute; left: -90px; top: 238px; width: 1024px; height: 300px; border-radius: 50%; background-color: {{panel}}; background-image: {{toneBg}}; background-size: 8px 8px; border: 4px solid {{ink}}; box-sizing: border-box"></div>

<div style="position: absolute; left: 312px; top: 50px; width: 220px; height: 275px">
<dc-import name="Rat" size="275" hint-size="220px,275px"></dc-import>
</div>

<div aria-hidden="true" style="position: absolute; left: 530px; top: 64px; writing-mode: vertical-rl; font-family: 'Dela Gothic One', sans-serif; font-size: 28px; line-height: 1; letter-spacing: -2px; color: {{cyan}}; text-shadow: {{outline}}">ゴゴゴ</div>

<svg aria-hidden="true" viewBox="0 0 70 70" style="position: absolute; left: 302px; top: 132px; width: 84px; height: 84px">
<polygon points="69,35 53.5,42.7 59,59 42.7,53.5 35,69 27.3,53.5 11,59 16.5,42.7 1,35 16.5,27.3 11,11 27.3,16.5 35,1 42.7,16.5 59,11 53.5,27.3" fill="{{lime}}" stroke="{{ink}}" stroke-width="2.5" stroke-linejoin="round"></polygon>
</svg>
<div aria-hidden="true" style="position: absolute; left: 302px; top: 156px; width: 84px; text-align: center; font-family: 'Dela Gothic One', sans-serif; font-size: 28px; line-height: 1; color: {{accent}}">!!</div>

<div style="position: absolute; left: 300px; top: 230px; width: 240px; height: 300px">
<dc-import name="Poulet" pose="dos" palier="2" size="300" hint-size="240px,300px"></dc-import>
</div>

<div aria-hidden="true" style="position: absolute; left: 556px; top: 198px; transform: rotate(12deg); font-family: 'Dela Gothic One', sans-serif; font-size: 58px; line-height: 1; color: {{accent}}; text-shadow: {{outline}}">ドン！</div>
<div aria-hidden="true" style="position: absolute; left: 600px; top: 262px; transform: rotate(12deg); font-size: 12px; color: {{ink}}; background: {{panel}}; padding: 0 4px; border: 1.5px solid {{ink}}">BAM !</div>
<div style="position: absolute; left: 168px; top: 256px; transform: rotate(-10deg); font-family: 'Dela Gothic One', sans-serif; font-size: 24px; line-height: 1; color: {{lime}}; text-shadow: {{outline}}">COMBO ×3</div>

<div style="position: absolute; left: 12px; top: 10px; width: 296px; box-sizing: border-box; padding: 5px 10px 8px; background: {{panel}}; border: 3px solid {{ink}}; box-shadow: 4px 4px 0 {{accent}}; display: flex; flex-direction: column; gap: 4px">
<div style="font-family: 'Dela Gothic One', sans-serif; font-size: 16px; line-height: 1.1">POULET</div>
<div style="height: 13px; background: {{panel}}; border: 2.5px solid {{ink}}; overflow: hidden"><div style="width: 72%; height: 100%; background: {{accent}}"></div></div>
<div style="height: 8px; background: {{panel}}; border: 2.5px solid {{ink}}; overflow: hidden"><div style="width: 55%; height: 100%; background: {{gauge}}"></div></div>
</div>

<div style="position: absolute; left: 352px; top: 6px; width: 140px; display: flex; flex-direction: column; align-items: center">
<div style="padding: 1px 10px; background: {{lime}}; color: #111111; border: 2px solid {{ink}}; font-family: 'Dela Gothic One', sans-serif; font-size: 13px; transform: skewX(-10deg)">ROUND 2 / 3</div>
<div style="font-family: 'Dela Gothic One', sans-serif; font-size: 36px; line-height: 1.1; color: {{ink}}; text-shadow: {{outlinePanel}}">0:47</div>
</div>

<div style="position: absolute; left: 532px; top: 10px; width: 246px; box-sizing: border-box; padding: 5px 10px 8px; background: {{panel}}; border: 3px solid {{ink}}; box-shadow: 4px 4px 0 {{accent}}; display: flex; flex-direction: column; gap: 4px; align-items: flex-end">
<div style="font-family: 'Dela Gothic One', sans-serif; font-size: 16px; line-height: 1.1">RAT « RATTRAPAGE »</div>
<div style="width: 100%; height: 13px; background: {{panel}}; border: 2.5px solid {{ink}}; overflow: hidden; display: flex; justify-content: flex-end; box-sizing: border-box"><div style="width: 38%; height: 100%; background: {{accent}}"></div></div>
</div>

<button aria-label="Pause" style="position: absolute; left: 788px; top: 12px; width: 44px; height: 44px; border: 3px solid {{ink}}; background: {{panel}}; box-shadow: 3px 3px 0 {{ink}}; display: flex; align-items: center; justify-content: center; cursor: pointer; padding: 0">
<svg aria-hidden="true" width="16" height="16" viewBox="0 0 16 16"><rect x="2" y="1" width="4" height="14" fill="{{ink}}"></rect><rect x="10" y="1" width="4" height="14" fill="{{ink}}"></rect></svg>
</button>

<sc-if value="{{showZones}}" hint-placeholder-val="{{ true }}">
<div style="position: absolute; left: 10px; top: 82px; width: 404px; height: 300px; box-sizing: border-box; border: 2.5px dashed {{ink}}; padding: 10px 12px; display: flex; flex-direction: column; align-items: flex-start">
<div style="background: {{panel}}; border: 4px double {{ink}}">
<div style="background: {{ink}}; color: {{panel}}; font-family: 'Dela Gothic One', sans-serif; font-size: 14px; padding: 1px 10px">{{left.title}}</div>
<div style="padding: 4px 10px 6px; display: flex; flex-direction: column; gap: 1px">
<sc-for list="{{left.lines}}" as="line" hint-placeholder-count="3">
<div style="font-size: 13px">{{line}}</div>
</sc-for>
</div>
</div>
</div>
<div style="position: absolute; left: 430px; top: 82px; width: 404px; height: 300px; box-sizing: border-box; border: 2.5px dashed {{ink}}; padding: 10px 12px; display: flex; flex-direction: column; align-items: flex-end">
<div style="background: {{panel}}; border: 4px double {{ink}}; text-align: right">
<div style="background: {{ink}}; color: {{panel}}; font-family: 'Dela Gothic One', sans-serif; font-size: 14px; padding: 1px 10px">{{right.title}}</div>
<div style="padding: 4px 10px 6px; display: flex; flex-direction: column; gap: 1px">
<sc-for list="{{right.lines}}" as="line" hint-placeholder-count="3">
<div style="font-size: 13px">{{line}}</div>
</sc-for>
</div>
</div>
</div>
</sc-if>

<div style="position: absolute; left: {{tagLeft}}; top: 270px; padding: 0 8px; background: {{cyan}}; color: #111111; border: 2px solid {{ink}}; transform: rotate(8deg); font-family: 'Dela Gothic One', sans-serif; font-size: 13px; z-index: 2">PRÊT !</div>
<button style="position: absolute; left: {{specialLeft}}; top: 284px; width: 100px; height: 100px; border: 0; background: transparent; cursor: pointer; padding: 0; filter: {{glowFilter}}">
<svg aria-hidden="true" viewBox="0 0 70 70" style="position: absolute; left: 0; top: 0; width: 100px; height: 100px"><polygon points="69,35 53.5,42.7 59,59 42.7,53.5 35,69 27.3,53.5 11,59 16.5,42.7 1,35 16.5,27.3 11,11 27.3,16.5 35,1 42.7,16.5 59,11 53.5,27.3" fill="{{accent}}" stroke="{{ink}}" stroke-width="3" stroke-linejoin="round"></polygon></svg>
<span style="position: relative; display: block; font-family: 'Dela Gothic One', sans-serif; font-size: 14px; line-height: 1.05; color: {{onAccent}}">COUP<br>DE BEC</span>
</button>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["clair","sombre"],"default":"clair"},"showZones":{"editor":"boolean","default":true},"hand":{"editor":"enum","options":["droitier","gaucher"],"default":"droitier"},"$preview":{"width":844,"height":390}}'>
class Component extends DCLogic {
  renderVals() {
    const dark = this.props.theme === 'sombre';
    const T = dark
      ? { paper: '#0B0B0D', panel: '#17171A', panel0: 'rgba(23,23,26,0)', ink: '#F2F2F2', tone: 'rgba(242,242,242,0.18)', accent: '#FF3D96', onAccent: '#0B0B0D', gauge: '#00E5FF', head: '#000000', cyan: '#00E5FF', lime: '#C6FF00', glowFilter: 'drop-shadow(0 0 10px rgba(255,61,150,0.85))' }
      : { paper: '#F4F1EA', panel: '#FFFFFF', panel0: 'rgba(255,255,255,0)', ink: '#111111', tone: 'rgba(17,17,17,0.22)', accent: '#FF2E88', onAccent: '#111111', gauge: '#00C2EB', head: '#3A3A3A', cyan: '#00C2EB', lime: '#B8F000', glowFilter: 'none' };
    const o = (c, w) => `-${w}px -${w}px 0 ${c}, ${w}px -${w}px 0 ${c}, -${w}px ${w}px 0 ${c}, ${w}px ${w}px 0 ${c}`;
    const defense = { title: 'DÉFENSE', lines: ['Maintenir : garde haute', 'Maintenir + glisser ↓ : garde basse', 'Glisser ← / → : esquive', 'Glisser ↓ : recul'] };
    const attack = { title: 'ATTAQUE', lines: ['Tap : jab / direct', 'Glisser ↔ : crochet', 'Glisser ↑ : uppercut'] };
    const gaucher = this.props.hand === 'gaucher';
    return {
      ...T,
      outline: o(T.ink, 2) + `, 4px 4px 0 ${T.ink}`,
      outlinePanel: o(T.panel, 2),
      toneBg: `radial-gradient(${dark ? 'rgba(0,229,255,0.35)' : 'rgba(0,194,235,0.45)'} 1.2px, transparent 1.4px)`,
      crowdBg: `radial-gradient(circle at 13px 18px, ${T.head} 11px, transparent 12px), radial-gradient(${T.tone} 1.3px, transparent 1.5px)`,
      focusBg: `radial-gradient(ellipse 250px 160px at 50% 42%, ${T.panel} 50%, ${T.panel0} 100%), repeating-conic-gradient(from 0deg at 50% 42%, ${T.ink} 0deg 0.7deg, ${T.panel} 0.7deg 5deg)`,
      showZones: this.props.showZones ?? true,
      left: gaucher ? attack : defense,
      right: gaucher ? defense : attack,
      specialLeft: gaucher ? '16px' : '730px',
      tagLeft: gaucher ? '80px' : '782px'
    };
  }
}
</script>
</body>
</html>
