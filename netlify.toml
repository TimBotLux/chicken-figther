# Déploiement Netlify du prototype (dossier app/).
[build]
  base = "app"
  command = "npm ci && npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# Une seule page : toute adresse inconnue renvoie le jeu.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Le service worker, la page et le manifeste ne doivent jamais rester en cache :
# c'est ce qui permet aux joueurs de recevoir les mises à jour.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"
    Cache-Control = "no-cache"

# Fichiers compilés : leur nom change à chaque version, cache long sans risque.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/icons/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
